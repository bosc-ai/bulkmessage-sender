<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t24 d24">
  <title id="t24">The WhatsApp 24-hour customer service window</title>
  <desc id="d24">A customer message opens a 24-hour window in which a business can reply with free-form messages. After it closes, only Meta-approved templates can be sent.</desc>
  <style>
    .h{font:600 22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .l{font:600 18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#14171A}
    .m{font:400 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#6B7280}
    .k{font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.05em}
  </style>
  <rect width="760" height="360" fill="#FAFAF7"/>
  <text x="32" y="46" class="h">The 24-hour customer service window</text>

  <line x1="32" y1="140" x2="728" y2="140" stroke="#E7E4DA" stroke-width="2"/>

  <rect x="112" y="108" width="368" height="64" rx="12" fill="#E6F8EE" stroke="#25D366" stroke-width="2"/>
  <text x="296" y="134" class="k" fill="#0F8A53" text-anchor="middle">WINDOW OPEN &#183; 24 HOURS</text>
  <text x="296" y="157" class="m" text-anchor="middle">Reply freely: text, images, documents</text>

  <rect x="496" y="108" width="232" height="64" rx="12" fill="#F4F2EC" stroke="#E7E4DA" stroke-width="2"/>
  <text x="612" y="134" class="k" fill="#6B7280" text-anchor="middle">WINDOW CLOSED</text>
  <text x="612" y="157" class="m" text-anchor="middle">Templates only</text>

  <circle cx="112" cy="140" r="9" fill="#25D366"/>
  <line x1="112" y1="149" x2="112" y2="206" stroke="#25D366" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="112" y="232" class="l" text-anchor="middle">Customer messages you</text>
  <text x="112" y="255" class="m" text-anchor="middle">Window opens</text>

  <circle cx="480" cy="140" r="9" fill="#F59E0B"/>
  <line x1="480" y1="149" x2="480" y2="206" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="480" y="232" class="l" text-anchor="middle">24 hours later</text>
  <text x="480" y="255" class="m" text-anchor="middle">Free-form replies stop</text>

  <rect x="32" y="286" width="696" height="52" rx="10" fill="#fff" stroke="#E7E4DA"/>
  <text x="52" y="309" class="m">Every customer reply reopens the window. A quick-reply button</text>
  <text x="52" y="330" class="m">on a template is the cheapest way to open one.</text>
</svg>
