<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="tb db">
  <title id="tb">How a WhatsApp broadcast is sent on the official API</title>
  <desc id="db">A broadcast goes from choosing a segment, to an approved template, to a paced send, to delivery events from Meta, with replies opening a 24-hour conversation window.</desc>
  <style>
    .h{font:600 22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .n{font:600 18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .m{font:400 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#6B7280}
    .num{font:700 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#fff}
  </style>
  <rect width="760" height="330" fill="#FAFAF7"/>
  <text x="32" y="44" class="h">How a broadcast actually runs</text>

  <rect x="32" y="72" width="160" height="130" rx="14" fill="#fff" stroke="#E7E4DA" stroke-width="1.5"/>
  <circle cx="56" cy="98" r="13" fill="#25D366"/><text x="56" y="103" class="num" text-anchor="middle">1</text>
  <text x="50" y="140" class="n">Segment</text>
  <text x="50" y="166" class="m">Tags, attributes,</text>
  <text x="50" y="186" class="m">lead stage</text>

  <path d="M200 137 L216 137" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="224" y="72" width="160" height="130" rx="14" fill="#fff" stroke="#E7E4DA" stroke-width="1.5"/>
  <circle cx="248" cy="98" r="13" fill="#25D366"/><text x="248" y="103" class="num" text-anchor="middle">2</text>
  <text x="242" y="140" class="n">Template</text>
  <text x="242" y="166" class="m">Approved by Meta,</text>
  <text x="242" y="186" class="m">variables per person</text>

  <path d="M392 137 L408 137" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="416" y="72" width="160" height="130" rx="14" fill="#fff" stroke="#E7E4DA" stroke-width="1.5"/>
  <circle cx="440" cy="98" r="13" fill="#25D366"/><text x="440" y="103" class="num" text-anchor="middle">3</text>
  <text x="434" y="140" class="n">Paced send</text>
  <text x="434" y="166" class="m">Throttled to your</text>
  <text x="434" y="186" class="m">messaging limit</text>

  <path d="M584 137 L600 137" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="608" y="72" width="120" height="130" rx="14" fill="#E6F8EE" stroke="#25D366" stroke-width="1.5"/>
  <circle cx="632" cy="98" r="13" fill="#0F8A53"/><text x="632" y="103" class="num" text-anchor="middle">4</text>
  <text x="626" y="140" class="n">Results</text>
  <text x="626" y="166" class="m">Delivered, read,</text>
  <text x="626" y="186" class="m">replied, opted out</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="32" y="230" width="696" height="72" rx="12" fill="#fff" stroke="#E7E4DA"/>
  <text x="52" y="258" class="m">A reply opens a 24-hour window in which you can respond with ordinary</text>
  <text x="52" y="280" class="m">messages. Replies and opt-outs tell you more than read rate, which is</text>
  <text x="52" y="302" class="m">high on WhatsApp for everything.</text>
</svg>
