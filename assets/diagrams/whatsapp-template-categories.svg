<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="tc dc">
  <title id="tc">WhatsApp message template categories</title>
  <desc id="dc">Meta sorts every template into Marketing, Utility or Authentication. The category determines what the message may say and what Meta charges for it.</desc>
  <style>
    .h{font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .n{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .m{font:400 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#6B7280}
    .k{font:600 10px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em}
  </style>
  <rect width="760" height="300" fill="#FAFAF7"/>
  <text x="32" y="40" class="h">The three template categories</text>

  <!-- Marketing -->
  <rect x="32" y="64" width="222" height="164" rx="12" fill="#fff" stroke="#E7E4DA"/>
  <rect x="32" y="64" width="222" height="5" rx="2.5" fill="#F59E0B"/>
  <text x="52" y="98" class="n">Marketing</text>
  <rect x="52" y="108" width="86" height="19" rx="9.5" fill="#FEF3E2"/>
  <text x="95" y="121" class="k" fill="#B45309" text-anchor="middle">HIGHEST COST</text>
  <text x="52" y="150" class="m">Promotions, launches,</text>
  <text x="52" y="168" class="m">cart recovery,</text>
  <text x="52" y="186" class="m">re-engagement</text>
  <text x="52" y="212" class="m">Needs opt-in</text>

  <!-- Utility -->
  <rect x="269" y="64" width="222" height="164" rx="12" fill="#fff" stroke="#E7E4DA"/>
  <rect x="269" y="64" width="222" height="5" rx="2.5" fill="#25D366"/>
  <text x="289" y="98" class="n">Utility</text>
  <rect x="289" y="108" width="70" height="19" rx="9.5" fill="#E6F8EE"/>
  <text x="324" y="121" class="k" fill="#0F8A53" text-anchor="middle">LOWER COST</text>
  <text x="289" y="150" class="m">Order updates,</text>
  <text x="289" y="168" class="m">receipts, shipping,</text>
  <text x="289" y="186" class="m">appointment reminders</text>
  <text x="289" y="212" class="m">Needs a real transaction</text>

  <!-- Authentication -->
  <rect x="506" y="64" width="222" height="164" rx="12" fill="#fff" stroke="#E7E4DA"/>
  <rect x="506" y="64" width="222" height="5" rx="2.5" fill="#06B6D4"/>
  <text x="526" y="98" class="n">Authentication</text>
  <rect x="526" y="108" width="76" height="19" rx="9.5" fill="#E0F7FC"/>
  <text x="564" y="121" class="k" fill="#0E7490" text-anchor="middle">OWN RATE</text>
  <text x="526" y="150" class="m">One-time passcodes,</text>
  <text x="526" y="168" class="m">account verification</text>
  <text x="526" y="212" class="m">Fixed shape, no marketing</text>

  <rect x="32" y="242" width="696" height="34" rx="9" fill="#fff" stroke="#E7E4DA"/>
  <text x="48" y="264" class="m">Submitting a promotion as Utility to save money is the most common reason a template is rejected.</text>
</svg>
