<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="tc dc">
  <title id="tc">WhatsApp message template categories</title>
  <desc id="dc">Meta sorts every template into Marketing, Utility or Authentication. The category determines what the message may say and what Meta charges for it.</desc>
  <style>
    .h{font:600 22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .n{font:600 20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .m{font:400 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#6B7280}
    .k{font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em}
  </style>
  <rect width="760" height="380" fill="#FAFAF7"/>
  <text x="32" y="46" class="h">The three template categories</text>

  <rect x="32" y="74" width="222" height="222" rx="14" fill="#fff" stroke="#E7E4DA" stroke-width="1.5"/>
  <rect x="32" y="74" width="222" height="6" rx="3" fill="#F59E0B"/>
  <text x="54" y="118" class="n">Marketing</text>
  <rect x="54" y="132" width="128" height="26" rx="13" fill="#FEF3E2"/>
  <text x="118" y="150" class="k" fill="#B45309" text-anchor="middle">HIGHEST COST</text>
  <text x="54" y="188" class="m">Promotions, launches,</text>
  <text x="54" y="212" class="m">cart recovery,</text>
  <text x="54" y="236" class="m">re-engagement</text>
  <text x="54" y="272" class="m">Needs opt-in</text>

  <rect x="269" y="74" width="222" height="222" rx="14" fill="#fff" stroke="#E7E4DA" stroke-width="1.5"/>
  <rect x="269" y="74" width="222" height="6" rx="3" fill="#25D366"/>
  <text x="291" y="118" class="n">Utility</text>
  <rect x="291" y="132" width="112" height="26" rx="13" fill="#E6F8EE"/>
  <text x="347" y="150" class="k" fill="#0F8A53" text-anchor="middle">LOWER COST</text>
  <text x="291" y="188" class="m">Order updates,</text>
  <text x="291" y="212" class="m">receipts, shipping,</text>
  <text x="291" y="236" class="m">appointment reminders</text>
  <text x="291" y="272" class="m">Needs a real transaction</text>

  <rect x="506" y="74" width="222" height="222" rx="14" fill="#fff" stroke="#E7E4DA" stroke-width="1.5"/>
  <rect x="506" y="74" width="222" height="6" rx="3" fill="#06B6D4"/>
  <text x="528" y="118" class="n">Authentication</text>
  <rect x="528" y="132" width="100" height="26" rx="13" fill="#E0F7FC"/>
  <text x="578" y="150" class="k" fill="#0E7490" text-anchor="middle">OWN RATE</text>
  <text x="528" y="188" class="m">One-time passcodes,</text>
  <text x="528" y="212" class="m">account verification</text>
  <text x="528" y="272" class="m">Fixed shape,</text>
  <text x="528" y="296" class="m" opacity="0">.</text>

  <rect x="32" y="314" width="696" height="46" rx="10" fill="#fff" stroke="#E7E4DA"/>
  <text x="52" y="343" class="m">Submitting a promotion as Utility is the most common reason a template is rejected.</text>
</svg>
