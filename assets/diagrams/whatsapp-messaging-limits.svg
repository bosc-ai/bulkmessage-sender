<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="tl dl">
  <title id="tl">WhatsApp messaging limit tiers</title>
  <desc id="dl">Meta sets a messaging limit per number, typically starting at 250 unique customers per rolling 24 hours and rising through 1,000, 10,000 and 100,000 as quality holds.</desc>
  <style>
    .h{font:600 22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .v{font:700 24px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A0A0A}
    .m{font:400 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#6B7280}
  </style>
  <rect width="760" height="360" fill="#FAFAF7"/>
  <text x="32" y="44" class="h">Messaging limits rise as quality holds</text>
  <text x="32" y="70" class="m">Unique customers you can start a conversation with per rolling 24 hours</text>

  <rect x="32"  y="222" width="128" height="62"  rx="12" fill="#E6F8EE" stroke="#25D366" stroke-width="1.5"/>
  <text x="96"  y="252" class="v" text-anchor="middle">250</text>
  <text x="96"  y="274" class="m" text-anchor="middle">new number</text>

  <rect x="184" y="182" width="128" height="102" rx="12" fill="#E6F8EE" stroke="#25D366" stroke-width="1.5"/>
  <text x="248" y="228" class="v" text-anchor="middle">1,000</text>
  <text x="248" y="252" class="m" text-anchor="middle">tier 1</text>

  <rect x="336" y="146" width="128" height="138" rx="12" fill="#D7F3E4" stroke="#1FB855" stroke-width="1.5"/>
  <text x="400" y="208" class="v" text-anchor="middle">10,000</text>
  <text x="400" y="232" class="m" text-anchor="middle">tier 2</text>

  <rect x="488" y="110" width="128" height="174" rx="12" fill="#C6EED8" stroke="#0F8A53" stroke-width="1.5"/>
  <text x="552" y="190" class="v" text-anchor="middle">100,000</text>
  <text x="552" y="214" class="m" text-anchor="middle">tier 3</text>

  <rect x="640" y="110" width="88"  height="174" rx="12" fill="#fff" stroke="#E7E4DA" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="684" y="188" class="m" text-anchor="middle">higher</text>
  <text x="684" y="210" class="m" text-anchor="middle">on request</text>

  <line x1="32" y1="290" x2="728" y2="290" stroke="#E7E4DA" stroke-width="2"/>
  <text x="32" y="322" class="m">Limits fall too. Blocks and reports lower your quality rating,</text>
  <text x="32" y="344" class="m">and the limit follows it down.</text>
</svg>
